# Development database for the server mode.
#   docker compose up -d     start PostgreSQL on localhost:5442
#   docker compose down -v   stop it and delete its data
#
# 5442 rather than 5432 avoids clashing with another local PostgreSQL;
# override it with TRANSF_ORM_DB_PORT (and DATABASE_URL for the tests).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: transf_orm
      POSTGRES_PASSWORD: transf_orm
      POSTGRES_DB: transf_orm
    ports:
      - "${TRANSF_ORM_DB_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transf_orm -d transf_orm"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
