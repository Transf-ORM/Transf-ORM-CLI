[package]
name = "transf-orm-server"
version.workspace = true
edition.workspace = true

[dependencies]
tracing.workspace = true
clap.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
transf-orm-core = { path = "../core" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "io-util"] }
tower = { version = "0.5", features = ["util"] }
