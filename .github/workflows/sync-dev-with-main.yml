name: Sync dev with main

on:
  push:
    branches:
      - main

jobs:
  sync-dev:
    if: github.repository == 'Transf-ORM/Transf-ORM-CLI'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_DEV_APP_ID }}
          private-key: ${{ secrets.SYNC_DEV_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v3
        with:
          ref: dev
          fetch-depth: 0
          # The default GITHUB_TOKEN can never bypass ruleset "require a
          # pull request" checks, no matter what's in the bypass list.
          # The installation token of the dedicated GitHub App (listed in
          # the ruleset bypass list) can, so pushes authenticated with it
          # go through.
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin dev
