name: Enforce main source branch

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  enforce-source-branch:
    if: github.repository == 'Transf-ORM/Transf-ORM-CLI'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev (or release-please) may merge into main
        if: github.base_ref == 'main' && github.head_ref != 'dev' && !startsWith(github.head_ref, 'release-please--')
        run: |
          echo "::error::PRs into main must come from dev (got '${{ github.head_ref }}')."
          exit 1
